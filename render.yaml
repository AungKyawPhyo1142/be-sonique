services:
  - type: web
    name: node-app
    env: node
    buildCommand: npm install -g pnpm && pnpm install && pnpm prisma:prepare && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sonique-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
    dependsOn:
      - sonique-db

  - type: postgres
    name: sonique-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: 15
